apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-bot
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-bot
  template:
    metadata:
      labels:
        app: incident-bot
    spec:
      containers:
      - name: incident-bot
        image: incident-bot:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 6000
---
apiVersion: v1
kind: Service
metadata:
  name: incident-bot
  namespace: monitoring
spec:
  selector:
    app: incident-bot
  ports:
  - port: 6000
    targetPort: 6000
